name: phone_app
description: "BabyWolf — noticias de retro y consolas, con monitor del wearable."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  provider: ^6.1.5+1
  sqflite: ^2.4.1 # noticias guardadas y cola de la mesa de ayuda
  path: ^1.9.0 # ruta del archivo .db
  flutter_secure_storage: ^9.2.2 # sesión de la cuenta (Keystore de Android)
  image_picker: ^1.1.2 # adjuntar imágenes en la mesa de ayuda

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.4 # SQLite en las pruebas (sin emulador)
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# Ícono propio (lobo pixel), no el default de Flutter.
# Regenerar con: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#1a1a2e"
  adaptive_icon_foreground: "assets/icon.png"
